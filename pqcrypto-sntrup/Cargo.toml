[package]
name = "pqcrypto-sntrup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Streamlined NTRU Prime implementation: KEM based on NTRU lattices."
categories = ["cryptography", "no-std"]
keywords = ["sntrup", "ntru-prime", "kem", "post-quantum", "lattice-based"]

[lints]
workspace = true

[dependencies]
pqcrypto-utils = { path = "../pqcrypto-utils", default-features = false }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true, default-features = false }

[dev-dependencies]
fastrand = "2"

[features]
default = ["std", "zeroize"]
std = ["alloc", "sha2/std", "sha3/std", "zeroize/alloc", "pqcrypto-utils/std", "getrandom/std"]
alloc = ["zeroize/alloc"]
zeroize = ["pqcrypto-utils/zeroize"]
