[package]
name = "backbone-sntrup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Streamlined NTRU Prime implementation: KEM based on NTRU lattices."
categories = ["cryptography", "no-std"]
keywords = ["sntrup", "ntru-prime", "kem", "post-quantum", "lattice-based"]
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
backbone-pqcrypto-internals = { version = "0.1.0", path = "../backbone-pqcrypto-internals", default-features = false }
sha2 = { workspace = true }
sha3 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
getrandom = { workspace = true, default-features = false }

[dev-dependencies]
fastrand = "2"

[features]
default = ["std", "zeroize"]
std = [
  "alloc",
  "sha2/std",
  "sha3/std",
  "zeroize/alloc",
  "backbone-pqcrypto-internals/std",
  "getrandom/std",
]
alloc = ["zeroize/alloc"]
zeroize = ["backbone-pqcrypto-internals/zeroize"]
