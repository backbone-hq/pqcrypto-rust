[package]
name = "backbone-hqc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HQC (FIPS 209) implementation: Hamming Quasi-Cyclic KEM."
categories = ["cryptography", "no-std"]
keywords = ["hqc", "fips-209", "kem", "post-quantum", "code-based"]
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
safe_arch = { version = "1", optional = true }
backbone-pqcrypto-internals = { version = "0.2.0", path = "../backbone-pqcrypto-internals", default-features = false }
subtle = { workspace = true }
zeroize = { workspace = true }
sha3 = { workspace = true, default-features = false }
getrandom = { workspace = true }

[features]
default = ["std", "zeroize"]
std = [
  "alloc",
  "sha3/std",
  "zeroize/alloc",
  "backbone-pqcrypto-internals/std",
  "getrandom/std",
]
alloc = ["zeroize/alloc"]
zeroize = ["backbone-pqcrypto-internals/zeroize"]
simd = ["safe_arch"]
