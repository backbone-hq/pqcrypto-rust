[package]
name = "backbone-mceliece"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Classic McEliece KEM implementation: code-based post-quantum key encapsulation."
categories = ["cryptography", "no-std"]
keywords = ["mceliece", "kem", "post-quantum", "code-based", "cryptography"]
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
safe_arch = { version = "1", optional = true }
backbone-pqcrypto-internals = { version = "0.2.1", path = "../backbone-pqcrypto-internals", default-features = false }
zeroize = { workspace = true }
sha3 = { workspace = true }
getrandom = { workspace = true }
subtle = { workspace = true }
rand_core = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }

[features]
default = ["std"]
std = [
  "alloc",
  "sha3/std",
  "backbone-pqcrypto-internals/std",
  "getrandom/std",
]
alloc = []
simd = ["safe_arch"]
