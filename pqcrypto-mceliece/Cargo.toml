[package]
name = "pqcrypto-mceliece"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Classic McEliece KEM implementation: code-based post-quantum key encapsulation."
categories = ["cryptography", "no-std"]
keywords = ["mceliece", "kem", "post-quantum", "code-based", "cryptography"]

[lints]
workspace = true

[dependencies]
safe_arch = { version = "1", optional = true }
pqcrypto-utils = { path = "../pqcrypto-utils", default-features = false }
zeroize = { workspace = true }
sha3 = { workspace = true, default-features = false }
getrandom = { workspace = true, default-features = false }
subtle = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true, default-features = false }

[features]
default = ["std", "zeroize"]
std = [
  "alloc",
  "sha3/std",
  "zeroize/alloc",
  "pqcrypto-utils/std",
  "getrandom/std",
]
alloc = ["zeroize/alloc"]
zeroize = ["pqcrypto-utils/zeroize"]
simd = ["safe_arch"]
