[package]
name = "backbone-ntruplr"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "NTRU LPRime implementation: KEM based on NTRU lattices."
categories = ["cryptography", "no-std"]
keywords = ["ntruplr", "ntru-lprime", "kem", "post-quantum", "lattice-based"]
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
backbone-pqcrypto-internals = { version = "0.2.1", path = "../backbone-pqcrypto-internals", default-features = false }
sha2 = { workspace = true }
sha3 = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
getrandom = { workspace = true, default-features = false }
rand_core = { workspace = true }

[features]
default = ["std"]
std = [
  "alloc",
  "sha2/std",
  "sha3/std",
  "backbone-pqcrypto-internals/std",
  "getrandom/std",
]
alloc = []
