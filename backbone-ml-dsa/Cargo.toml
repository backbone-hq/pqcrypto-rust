[package]
name = "backbone-ml-dsa"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "ML-DSA (FIPS 204) implementation: Module-Lattice-Based Digital Signature Standard."
categories = ["cryptography", "no-std"]
keywords = ["ml-dsa", "fips-204", "signature", "post-quantum", "lattice-based"]
exclude = ["tests/"]

[lints]
workspace = true

[dependencies]
subtle = { workspace = true }
safe_arch = { version = "1", optional = true }
backbone-pqcrypto-internals = { version = "0.2.1", path = "../backbone-pqcrypto-internals", default-features = false }
zeroize = { workspace = true }
sha3 = { workspace = true }
getrandom = { workspace = true }
rand_core = { workspace = true }

[features]
default = ["std"]
std = ["alloc", "sha3/std", "backbone-pqcrypto-internals/std", "getrandom/std"]
alloc = []
simd = ["safe_arch"]
