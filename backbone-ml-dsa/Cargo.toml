[package]
name = "backbone-ml-dsa"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ML-DSA (FIPS 204) implementation: Module-Lattice-Based Digital Signature Standard"
categories = ["cryptography", "no-std"]
keywords = ["ml-dsa", "fips-204", "signature", "post-quantum", "lattice-based"]

[lints]
workspace = true

[dependencies]
subtle = { workspace = true }
safe_arch = { version = "1", optional = true }
backbone-pqcrypto-internals = { path = "../backbone-pqcrypto-internals", default-features = false }
zeroize = { workspace = true }
sha3 = { workspace = true }
getrandom = { workspace = true }

[features]
default = ["std", "zeroize"]
std = ["alloc", "sha3/std", "zeroize/alloc", "backbone-pqcrypto-internals/std", "getrandom/std"]
alloc = ["zeroize/alloc"]
zeroize = ["backbone-pqcrypto-internals/zeroize"]
simd = ["safe_arch"]

[dev-dependencies]
hex = "0.4"
