[workspace]
resolver = "3"
members = [
  "backbone-pqcrypto-internals",
  "backbone-mceliece",
  "backbone-ml-kem",
  "backbone-ml-dsa",
  "backbone-sphincs",
  "backbone-hqc",
  "backbone-sntrup",
  "backbone-ntruplr",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/backbone-hq/pqcrypto-rust"
homepage = "https://github.com/backbone-hq/pqcrypto-rust"
authors = ["Backbone Authors <root@backbone.dev>"]

[workspace.dependencies]
# Common dependencies that can be shared across crates
getrandom = { version = "0.2", default-features = false }
sha3 = { version = "0.10", default-features = false, features = ["asm"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false, features = [
  "derive",
  "alloc",
] }
subtle = { version = "2", default-features = false }
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
ctr = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
dead_code = "deny"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "deny"
trivial_casts = "forbid"
trivial_numeric_casts = "forbid"
unsafe_code = "forbid"
unused_lifetimes = "warn"
unused_qualifications = "forbid"

[workspace.lints.clippy]
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
must_use_candidate = "warn"
needless_range_loop = "allow"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"
unwrap_used = "warn"

# ---------------------------------------------------------------------------
# Workspace build profiles.
#
# Defined in the workspace-root manifest (the canonical location — Cargo only
# reads profiles from here and ignores dependency-defined profiles). Member
# crates inherit these automatically; nothing is needed per crate. Keep
# .cargo/config.toml free of [profile] tables: config-level profiles silently
# override these settings.
# ---------------------------------------------------------------------------

# Benchmarks: same aggressive optimization as release.
[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1

# Release profile — best performance.
# Security: unwind (not abort) so Drop-based zeroization (SecretVec/
# SecretArray/Zeroizing) runs on panic. Keeps release consistent with the
# dev/bench defaults; release-pgo inherits this too. Abort in [profile.dev]
# would also break the test harness's panic isolation.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
panic = "unwind"
strip = "symbols"

# Fast iteration profile (dev builds with some optimizations).
[profile.dev]
opt-level = 1
debug = 1

# PGO-optimized release profile (used by cargo-pgo).
[profile.release-pgo]
inherits = "release"
lto = true
